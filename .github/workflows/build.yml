name: build

# Builds a Wayland-enabled, bionic-native Hangover (Wine + FEX WoW64) for Android
# arm64 and publishes it as a GitHub Release asset. Public repo → free unlimited
# Actions minutes. Uses Termux's own pinned Docker builder (the setup
# termux-packages CI uses), which works correctly on GitHub runners and avoids the
# host-OS gaps a native build hits. Versions are not hardcoded: termux-packages is
# cloned at its latest ref and the Hangover version is read from the recipe.

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: "termux-packages ref to build from (default: latest master)"
        default: "master"
  push:
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERMUX_REF: ${{ github.event.inputs.termux_ref || 'master' }}
      ASSET: hangover-bionic-aarch64.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Clone termux-packages (${{ env.TERMUX_REF }})
        run: |
          git clone --depth 1 --branch "$TERMUX_REF" \
            https://github.com/termux/termux-packages .work/termux-packages

      - name: Apply Wayland + FEX-backend overlays to the hangover-wine recipe
        run: |
          recipe=.work/termux-packages/x11-packages/hangover-wine/build.sh
          ./patches/enable-wayland.sh "$recipe"
          ./patches/install-fex-backends.sh "$recipe"
          echo "----- patched recipe -----"
          grep -nE "TERMUX_PKG_DEPENDS=|TERMUX_PKG_BUILD_DEPENDS=|with-wayland|post_massage" \
            "$recipe"

      - name: Resolve Hangover version from the recipe
        id: ver
        run: |
          v="$(. .work/termux-packages/x11-packages/hangover-wine/build.sh 2>/dev/null; echo "$TERMUX_PKG_VERSION")"
          [ -n "$v" ] || { echo "could not read TERMUX_PKG_VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=hangover-bionic-$v" >> "$GITHUB_OUTPUT"
          echo "Hangover version: $v"

      - name: Build hangover-wine (Termux Docker builder)
        working-directory: .work/termux-packages
        run: ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I hangover-wine

      - name: Collect the built .deb
        run: |
          mkdir -p out
          cp .work/termux-packages/output/hangover-wine_*.deb out/
          ls -la out/

      - name: Preserve raw .deb (even if the gate fails)
        uses: actions/upload-artifact@v4
        with:
          name: hangover-wine-deb-${{ steps.ver.outputs.version }}
          path: out/hangover-wine_*.deb
          if-no-files-found: error

      - name: Verify package contents (release gate)
        run: |
          # Hard gate: the .deb MUST contain winewayland.drv AND all three FEX
          # WoW64 backends (libwow64fex / libarm64ecfex / wowbox64). A green
          # build that is missing a backend is a functionally-dead release, so
          # fail here before anything is published.
          ./inspect-deb.sh out/hangover-wine_*.deb

      - name: Fetch bionic runtime-dependency .debs
        env:
          OUTPUT: ${{ github.workspace }}/out/deps
          RECIPE: ${{ github.workspace }}/.work/termux-packages/x11-packages/hangover-wine/build.sh
        run: ./fetch-runtime-deps.sh

      - name: Bundle everything into one tar
        run: |
          rm -f out/deps/.Packages* out/deps/.records || true
          tar -C out -cf "$ASSET" .
          ls -la "$ASSET" out out/deps | head -40

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: hangover-bionic-${{ steps.ver.outputs.version }}-aarch64
          path: |
            out/hangover-wine_*.deb
            ${{ env.ASSET }}
          if-no-files-found: error

      - name: Publish to GitHub Release (a new release per successful build)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          # One distinct release per successful build (not a single release that
          # gets clobbered each time). The tag carries the Hangover version plus
          # the CI build number so every build is its own, sortable entry. Each
          # is marked --latest, so the stable releases/latest/download/<asset>
          # URL always resolves to the newest build's assets.
          TAG="hangover-bionic-${VERSION}-build${RUN}"
          notes="Wayland-enabled, bionic-native Hangover ${VERSION} (Wine + FEX WoW64)
          for Android arm64, built from termux-packages \`${TERMUX_REF}\` with
          \`--with-wayland\` and the FEX WoW64 backends (libwow64fex,
          libarm64ecfex, wowbox64). Loads via /system/bin/linker64 at targetSdk 36.

          Build #${RUN} · commit ${GITHUB_SHA}

          Stable download (always newest):
          \`releases/latest/download/${ASSET}\`

          Assets:
          - ${ASSET} — Hangover package + bionic runtime-dep .debs
          - hangover-wine_${VERSION}_aarch64.deb — the package alone"
          gh release create "$TAG" \
            --title "Hangover bionic ${VERSION} (Wayland + FEX) — build #${RUN}" \
            --notes "$notes" --latest --target "$GITHUB_SHA"
          gh release upload "$TAG" "$ASSET" out/hangover-wine_*.deb --clobber
